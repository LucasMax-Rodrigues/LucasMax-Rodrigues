name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:

      # 1. Gera o card de Status Gerais
      - name: GitHub Metrics - Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasMax-Rodrigues
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          filename: stats.svg
          output_action: deploy
          committer_branch: stats-output

      # 2. Gera o card de Linguagens mais usadas
      - name: GitHub Metrics - Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasMax-Rodrigues
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          config_timezone: America/Sao_Paulo
          filename: languages.svg
          output_action: deploy
          committer_branch: languages-output

      # 3. Gera o Gráfico de Atividade (Activity Graph)
      - name: GitHub Metrics - Activity Graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LucasMax-Rodrigues
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: America/Sao_Paulo
          filename: activity-graph.svg
          output_action: deploy
          committer_branch: activity-graph-output
